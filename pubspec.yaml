name: finders_keepers
description: A campus lost-and-found application. Find what's lost. Return what's found.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase (stubs — configure after adding google-services.json)
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.2.0

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.13

dependency_overrides:
  path_provider_android: 2.2.17
  shared_preferences_android: 2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: DMSerifDisplay
  #     fonts:
  #       - asset: assets/fonts/DMSerifDisplay-Regular.ttf
  #       - asset: assets/fonts/DMSerifDisplay-Italic.ttf
  #         style: italic
